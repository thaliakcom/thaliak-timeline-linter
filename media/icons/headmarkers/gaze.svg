<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 225 88">
  <defs>
    <path id="gaze-outer" d="M3 44 A160.9 160.9 0 0 1 222 44 A160.9 160.9 0 0 1 3 44 Z" />
    <path id="gaze-inner" d="M20 44 A126.95 126.95 0 0 1 205 44 A126.95 126.95 0 0 1 20 44 Z" />
    <clipPath id="gaze-clip">
      <use href="#gaze-inner" />
    </clipPath>
    <radialGradient id="gaze-iris" cx="113" cy="44" r="95" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4a4a" />
      <stop offset="0.25" stop-color="#c8222c" />
      <stop offset="0.7" stop-color="#8c161e" />
      <stop offset="1" stop-color="#701218" />
    </radialGradient>
    <linearGradient id="gaze-rim" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f08080" />
      <stop offset="0.5" stop-color="#e2505a" />
      <stop offset="1" stop-color="#f08080" />
    </linearGradient>
    <linearGradient id="gaze-flare" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ff8080" stop-opacity="0" />
      <stop offset="0.5" stop-color="#ffb0b0" stop-opacity="0.8" />
      <stop offset="1" stop-color="#ff8080" stop-opacity="0" />
    </linearGradient>
    <filter id="gaze-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <filter id="gaze-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
  </defs>
  <use href="#gaze-outer" fill="url(#gaze-rim)" />
  <!-- Dark ticks along the inner edge give the rim its striped look. -->
  <use href="#gaze-inner" fill="none" stroke="#8a1424" stroke-opacity="0.35" stroke-width="12" stroke-dasharray="2 2.5 3.5 2" />
  <use href="#gaze-inner" fill="url(#gaze-iris)" />
  <g clip-path="url(#gaze-clip)">
    <rect x="20" y="43.2" width="185" height="1.6" fill="url(#gaze-flare)" />
    <rect x="135" y="46.5" width="70" height="1.2" fill="#e070e0" fill-opacity="0.35" transform="rotate(1.5 135 46.5)" />
    <rect x="114" y="58" width="1.2" height="26" fill="#ffb0d0" fill-opacity="0.25" />
    <circle cx="113" cy="43" r="26" fill="#ff3a3a" fill-opacity="0.9" filter="url(#gaze-glow)" />
    <circle cx="113" cy="43" r="16" fill="#fff" fill-opacity="0.8" filter="url(#gaze-soft)" />
    <circle cx="113" cy="43" r="14" fill="#fff8f0" />
  </g>
</svg>
