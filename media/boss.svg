<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 124 124">
  <defs>
    <filter id="boss-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.6" />
    </filter>
    <filter id="boss-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <filter id="boss-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" />
    </filter>
    <linearGradient id="boss-core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf0" />
      <stop offset="1" stop-color="#ffb43a" />
    </linearGradient>
    <g id="boss-features">
      <path transform="translate(51.2 52.8) rotate(45) scale(1 0.7) rotate(-45) translate(-51.2 -52.8)" d="M44 45.5 L49.5 50.5 Q52.5 51.2 54.8 51 Q55.6 55 58.5 60 Q49 60.5 46 57.5 Q43.8 54 44 45.5 Z" />
      <path transform="translate(72.8 52.8) rotate(-45) scale(1 0.7) rotate(45) translate(-72.8 -52.8)" d="M80 45.5 L74.5 50.5 Q71.5 51.2 69.2 51 Q68.4 55 65.5 60 Q75 60.5 78 57.5 Q80.2 54 80 45.5 Z" />
      <path d="M46.5 63.5 L49 66 L55 66.5 L56.6 70 L58.2 67.5 L65.8 67.5 L67.4 70 L69 66.5 L75 66 L77.5 63.5 L76 67 L76 76 L77.5 79.5 L71.5 76 L70 71.5 L68.5 74.5 L55.5 74.5 L54 71.5 L52.5 76 L46.5 79.5 L48 76 L48 67 Z" />
    </g>
  </defs>
  <!-- Facing ring with a gap at the top. -->
  <path d="M97.67 19.48 A55.5 55.5 0 1 1 26.33 19.48" fill="none" stroke="#f2f2f2" stroke-width="6.5" />
  <!-- Face: a four-pointed dark body, mostly hidden behind a dark halo around the glowing features. -->
  <path d="M35 37 Q62 62 89 37 Q71.5 62 88 87 Q62 77 39 87 Q50.5 62 35 37 Z" fill="#000" filter="url(#boss-soft)" />
  <use href="#boss-features" fill="#000" stroke="#f2f2f2" stroke-width="7" stroke-linejoin="round" filter="url(#boss-shadow)" />
  <use href="#boss-features" fill="#ff7400" stroke="#ff7400" stroke-width="2" filter="url(#boss-glow)" />
  <use href="#boss-features" fill="url(#boss-core)" stroke="#ff8a00" stroke-width="1.3" stroke-linejoin="round" />
</svg>
